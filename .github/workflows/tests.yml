name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
        laravel: ['10.*', '11.*', '12.*', '13.*']
        filament: ['3.*', '4.*', '5.*']
        include:
          - laravel: '10.*'
            testbench: '8.*'

          - laravel: '11.*'
            testbench: '9.*'

          - laravel: '12.*'
            testbench: '10.*'

          - laravel: '13.*'
            testbench: '11.*'
        exclude:
          - php: '8.1'
            laravel: '11.*'

          - php: '8.1'
            laravel: '12.*'

          - php: '8.1'
            laravel: '13.*'

          - php: '8.2'
            laravel: '13.*'

          - laravel: '10.*'
            filament: '4.*'

          - laravel: '10.*'
            filament: '5.*'

    name: PHP ${{ matrix.php }} - Laravel ${{ matrix.laravel }} - Filament ${{ matrix.filament }}

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: bcmath, ctype, dom, fileinfo, intl, mbstring
          coverage: none

      - name: Install dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" "filament/forms:${{ matrix.filament }}" --no-interaction --no-update
          composer update --prefer-dist --no-interaction --no-progress --with-all-dependencies

      - name: Run tests
        run: vendor/bin/pest
